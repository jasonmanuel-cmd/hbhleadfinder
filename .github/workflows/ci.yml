name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every step here is a real gate. Nothing is allowed to fail silently — a red build
# has to be visible, or the checks are decoration.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Database contract tests
        # Applies every migration to a real Postgres engine and checks the rules the
        # business depends on: matching, scoring, compliance guards, do-not-contact.
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high
