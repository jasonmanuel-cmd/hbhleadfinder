name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npx next lint
      - name: Security audit
        run: npm audit
      - name: Type check
        run: npx tsc --noEmit || true
      - name: Build
        run: npx next build || true

  dependabot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=high

  # Dependabot configuration
  # (defined in .github/dependabot.yml)
